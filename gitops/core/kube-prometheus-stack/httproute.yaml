apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus
spec:
  parentRefs:
    - name: envoy
      namespace: envoy-gateway
  hostnames:
    - "prometheus.nce.wtf"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: "/"
      backendRefs:
        - name: kube-prometheus-stack-prometheus
          port: 9090
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus-remote-write
spec:
  parentRefs:
    - name: envoy
      namespace: envoy-gateway
  hostnames:
    - "prometheus-write.nce.wtf"
  rules:
    - matches:
        - path:
            type: Exact
            value: "/api/v1/write"
      backendRefs:
        - name: kube-prometheus-stack-prometheus
          port: 9090
