apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: lychee
  namespace: flux-system
spec:
  interval: 1h
  path: ./gitops/core/lychee
  prune: true
  dependsOn:
    - name: external-dns
    - name: longhorn
    - name: cert-manager
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: lychee
      namespace: lychee
